openapi: 3.0.3
info:
  title: Shoes Store API Specification
  description: Complete OpenAPI specification for the Shoes Store backend built with Node.js, Express, and MySQL.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Server
paths:
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new account
      description: Creates a pending user registration and sends a six-digit OTP to the email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - email
                - password
              properties:
                full_name:
                  type: string
                  example: example
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                  example: nguyenvana@gmail.com
                password:
                  type: string
                  example: Password123
                  description: See schema constraints.
                phone:
                  type: string
                  example: 987654321
                  pattern: ^0\d{9}$
      responses:
        '201':
          description: Resource created successfully.
        '400':
          description: Invalid request data.
  /api/auth/verify-otp:
    post:
      tags:
        - Authentication
      summary: Verify OTP
      description: Verifies a pending registration with the OTP sent by email and creates the user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                  example: nguyenvana@gmail.com
                otp:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: Request completed successfully.
        '400':
          description: Invalid request data.
  /api/auth/resend-otp:
    post:
      tags:
        - Authentication
      summary: Resend OTP
      description: Generates and sends a new OTP for a pending registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: nguyenvana@gmail.com
      responses:
        '200':
          description: Request completed successfully.
        '400':
          description: Invalid request data.
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Log in with email and password
      description: Authenticates a user with email and password and returns a JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@gmail.com
                password:
                  type: string
                  example: AdminPassword123
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: example
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          full_name:
                            type: string
                            example: Admin Store
                          email:
                            type: string
                            example: admin@gmail.com
                          role:
                            type: string
                            example: admin
        '401':
          description: Authentication is required or invalid.
  /api/auth/google:
    post:
      tags:
        - Authentication
      summary: Log in with Google
      description: Authenticates or links a user with a Google ID token and returns a JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - credential
              properties:
                credential:
                  type: string
                  example: Google_Id_Token_String_Here
      responses:
        '200':
          description: Request completed successfully.
  /api/profile:
    get:
      tags:
        - Profile
      summary: Get current profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Request completed successfully.
      description: Returns the authenticated user profile.
    put:
      tags:
        - Profile
      summary: Update current profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  example: example
                phone:
                  type: string
                  example: 912345678
                address:
                  type: string
                  example: example
                gender:
                  type: string
                  enum:
                    - nam
                    - nu
                    - khac
                  example: nam
                dob:
                  type: string
                  format: date
                  example: '1995-10-15'
      responses:
        '200':
          description: Request completed successfully.
      description: Updates profile fields for the authenticated user.
  /api/profile/change-password:
    put:
      tags:
        - Profile
      summary: Change password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
              properties:
                old_password:
                  type: string
                  example: Password123
                new_password:
                  type: string
                  example: NewPassword123
      responses:
        '200':
          description: Request completed successfully.
        '400':
          description: Invalid request data.
      description: Changes the authenticated user password after validating the current password.
  /api/profile/avatar:
    put:
      tags:
        - Profile
      summary: Update avatar
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: See schema constraints.
      responses:
        '200':
          description: Request completed successfully.
      description: Uploads and stores a new avatar for the authenticated user.
  /api/admin/categories:
    get:
      tags:
        - Admin Category
      summary: List admin categories
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Request completed successfully.
      description: Returns the category tree for admin management.
    post:
      tags:
        - Admin Category
      summary: Create category
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: example
                parent_id:
                  type: string
                  example: '1'
                  description: See schema constraints.
                sort_order:
                  type: string
                  example: '1'
                  description: See schema constraints.
                image:
                  type: string
                  format: binary
                  description: See schema constraints.
      responses:
        '201':
          description: Resource created successfully.
      description: Creates a new category or child category.
  /api/admin/categories/{id}:
    put:
      tags:
        - Admin Category
      summary: Update category
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 3
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: example
                parent_id:
                  type: string
                  example: '1'
                sort_order:
                  type: string
                  example: '5'
                image:
                  type: string
                  format: binary
                  description: See schema constraints.
      responses:
        '200':
          description: Request completed successfully.
      description: Updates a category by ID.
  /api/admin/categories/{id}/toggle-status:
    put:
      tags:
        - Admin Category
      summary: Toggle category status
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Request completed successfully.
      description: Toggles a category active status.
  /api/admin/categories/reorder:
    put:
      tags:
        - Admin Category
      summary: Reorder categories
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - sort_order
                    properties:
                      id:
                        type: integer
                        example: 1
                      sort_order:
                        type: integer
                        example: 10
      responses:
        '200':
          description: Request completed successfully.
      description: Updates category sort order in bulk.
  /api/admin/brands:
    get:
      tags:
        - Admin Brand
      summary: List admin brands
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Request completed successfully.
      description: Returns all brands for admin management.
    post:
      tags:
        - Admin Brand
      summary: Create brand
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Nike
                description:
                  type: string
                  example: example
                logo:
                  type: string
                  format: binary
                  description: See schema constraints.
      responses:
        '201':
          description: Resource created successfully.
      description: Creates a new brand.
  /api/admin/brands/{id}:
    put:
      tags:
        - Admin Brand
      summary: Update brand
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Nike Store
                description:
                  type: string
                  example: example
                logo:
                  type: string
                  format: binary
                  description: See schema constraints.
      responses:
        '200':
          description: Request completed successfully.
      description: Updates a brand by ID.
  /api/admin/brands/{id}/toggle-status:
    put:
      tags:
        - Admin Brand
      summary: Toggle brand status
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Request completed successfully.
      description: Toggles a brand active status.
  /api/addresses:
    get:
      tags:
        - Addresses
      summary: List addresses
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: example
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        user_id:
                          type: integer
                          example: 2
                        receiver_name:
                          type: string
                          example: example
                        phone:
                          type: string
                          example: '0987654321'
                        address_line:
                          type: string
                          example: example
                        ward:
                          type: string
                          example: example
                        district:
                          type: string
                          example: example
                        city:
                          type: string
                          example: example
                        is_default:
                          type: boolean
                          example: true
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
      description: Returns shipping addresses for the authenticated user.
    post:
      tags:
        - Addresses
      summary: Create address
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - receiver_name
                - phone
                - address_line
                - district
                - city
              properties:
                receiver_name:
                  type: string
                  example: example
                  minLength: 2
                  maxLength: 100
                phone:
                  type: string
                  example: '0987654321'
                  pattern: ^0\d{9}$
                address_line:
                  type: string
                  example: example
                  minLength: 5
                  maxLength: 255
                ward:
                  type: string
                  example: example
                  maxLength: 100
                  nullable: true
                district:
                  type: string
                  example: example
                  maxLength: 100
                city:
                  type: string
                  example: example
                  maxLength: 100
      responses:
        '201':
          description: Resource created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: example
                  data:
                    type: object
      description: Creates a new shipping address for the authenticated user.
  /api/addresses/{id}:
    put:
      tags:
        - Addresses
      summary: Update address
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                receiver_name:
                  type: string
                  example: example
                  minLength: 2
                  maxLength: 100
                phone:
                  type: string
                  example: '0912345678'
                  pattern: ^0\d{9}$
                address_line:
                  type: string
                  example: example
                  minLength: 5
                  maxLength: 255
                ward:
                  type: string
                  example: example
                  maxLength: 100
                  nullable: true
                district:
                  type: string
                  example: example
                  maxLength: 100
                city:
                  type: string
                  example: example
                  maxLength: 100
      responses:
        '200':
          description: Request completed successfully.
        '400':
          description: Invalid request data.
        '403':
          description: The authenticated user is not allowed to access this resource.
        '404':
          description: The requested resource was not found.
      description: Updates one shipping address owned by the authenticated user.
    delete:
      tags:
        - Addresses
      summary: Delete address
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Request completed successfully.
        '403':
          description: The authenticated user is not allowed to access this resource.
        '404':
          description: The requested resource was not found.
      description: Deletes one shipping address owned by the authenticated user.
  /api/addresses/{id}/default:
    put:
      tags:
        - Addresses
      summary: Set default address
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Request completed successfully.
        '403':
          description: The authenticated user is not allowed to access this resource.
        '404':
          description: The requested resource was not found.
      description: Sets one shipping address as the authenticated user default address.
  /api/products:
    get:
      tags:
        - Products
      summary: List public products
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
        - name: category_id
          in: query
          schema:
            type: integer
        - name: category_slug
          in: query
          schema:
            type: string
        - name: brand_id
          in: query
          schema:
            type: integer
        - name: gender
          in: query
          schema:
            type: string
            enum:
              - male
              - female
              - unisex
        - name: sport_type
          in: query
          schema:
            type: string
        - name: featured
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - newest
              - popular
              - name_asc
              - name_desc
      responses:
        '200':
          description: Request completed successfully.
      description: Returns active products with filtering and pagination.
  /api/products/{slug}:
    get:
      tags:
        - Products
      summary: Get public product detail
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Request completed successfully.
        '404':
          description: The requested resource was not found.
      description: Returns one active product by slug.
  /api/categories:
    get:
      tags:
        - Catalog
      summary: List public categories
      responses:
        '200':
          description: Request completed successfully.
      description: Returns active categories for the public catalog.
  /api/brands:
    get:
      tags:
        - Catalog
      summary: List public brands
      responses:
        '200':
          description: Request completed successfully.
      description: Returns active brands for the public catalog.
  /api/admin/products:
    get:
      tags:
        - Admin Products
      summary: List admin products
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Request completed successfully.
      description: Returns products for admin management with filtering and pagination.
    post:
      tags:
        - Admin Products
      summary: Create product
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category_id
                - brand_id
                - name
              properties:
                category_id:
                  type: integer
                brand_id:
                  type: integer
                name:
                  type: string
                description:
                  type: string
                gender:
                  type: string
                  enum:
                    - male
                    - female
                    - unisex
                sport_type:
                  type: string
                is_featured:
                  type: boolean
          multipart/form-data:
            schema:
              type: object
              required:
                - category_id
                - brand_id
                - name
              properties:
                category_id:
                  type: integer
                brand_id:
                  type: integer
                name:
                  type: string
                description:
                  type: string
                gender:
                  type: string
                  enum:
                    - male
                    - female
                    - unisex
                sport_type:
                  type: string
                is_featured:
                  type: boolean
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Resource created successfully.
        '400':
          description: Invalid request data.
        '403':
          description: The authenticated user is not allowed to access this resource.
      description: Creates a new product.
  /api/admin/products/{id}:
    put:
      tags:
        - Admin Products
      summary: Update product
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Request completed successfully.
        '404':
          description: The requested resource was not found.
      description: Updates a product by ID.
  /api/admin/products/{id}/toggle-status:
    put:
      tags:
        - Admin Products
      summary: Toggle product status
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Request completed successfully.
        '404':
          description: The requested resource was not found.
      description: Toggles a product active status.
  /api/admin/products/{id}/variants:
    put:
      tags:
        - Admin Products
      summary: Replace or update product variants
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - variants
              properties:
                variants:
                  type: array
                  items:
                    type: object
                    required:
                      - size
                      - stock_quantity
                    properties:
                      sku:
                        type: string
                      size:
                        type: string
                        example: '40'
                      stock_quantity:
                        type: integer
                        example: 10
                      low_stock_threshold:
                        type: integer
                        example: 3
                      is_active:
                        type: boolean
      responses:
        '200':
          description: Request completed successfully.
  /api/cart:
    get:
      tags:
        - Cart
      summary: Get current cart
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Request completed successfully.
    delete:
      tags:
        - Cart
      summary: Clear current cart
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Request completed successfully.
  /api/cart/items:
    post:
      tags:
        - Cart
      summary: Add item to cart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - variant_id
                - quantity
              properties:
                variant_id:
                  type: integer
                  example: 1
                quantity:
                  type: integer
                  example: 1
      responses:
        '201':
          description: Resource created successfully.
  /api/cart/items/{id}:
    put:
      tags:
        - Cart
      summary: Update cart item quantity
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: integer
                  example: 2
      responses:
        '200':
          description: Request completed successfully.
    delete:
      tags:
        - Cart
      summary: Remove item from cart
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Request completed successfully.
  /api/orders/checkout:
    post:
      tags:
        - Orders
      summary: Checkout current cart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address_id
              properties:
                address_id:
                  type: integer
                  example: 1
                payment_method:
                  type: string
                  enum:
                    - cod
                    - vnpay
                  example: cod
                note:
                  type: string
      responses:
        '201':
          description: Resource created successfully.
  /api/orders:
    get:
      tags:
        - Orders
      summary: List customer orders
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Request completed successfully.
  /api/orders/{id}:
    get:
      tags:
        - Orders
      summary: Get customer order detail
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Request completed successfully.
  /api/orders/{id}/cancel:
    post:
      tags:
        - Orders
      summary: Cancel customer order
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Request completed successfully.
  /api/orders/vnpay/return:
    get:
      tags:
        - Payments
      summary: Handle VNPAY return callback
      responses:
        '200':
          description: Request completed successfully.
  /api/admin/inventory:
    get:
      tags:
        - Admin Inventory
      summary: List product variant inventory
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: low_stock
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Request completed successfully.
  /api/admin/inventory/adjustments:
    post:
      tags:
        - Admin Inventory
      summary: Adjust inventory manually
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - variant_id
                - type
                - quantity
              properties:
                variant_id:
                  type: integer
                  example: 1
                type:
                  type: string
                  enum:
                    - in
                    - out
                    - adjustment
                quantity:
                  type: integer
